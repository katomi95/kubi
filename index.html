<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="theme-color" content="#9fd8f5">
<title>首を長くして待つ</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{width:100%;height:100%;overflow:hidden;background:#9fd8f5;touch-action:none;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    font-family:"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic",Meiryo,system-ui,sans-serif;
    color:#2b3440;}
  canvas{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;}
  .hide{display:none!important;}

  #hud{position:fixed;left:0;right:0;top:0;padding:max(8px,env(safe-area-inset-top)) max(12px,env(safe-area-inset-right)) 0 max(12px,env(safe-area-inset-left));
       display:flex;align-items:flex-start;gap:10px;pointer-events:none;padding-right:76px;}
  #hud .stg{font-weight:800;font-size:clamp(13px,2.3vmin,18px);background:rgba(255,255,255,.88);border:2px solid #2b3440;border-radius:10px;
            padding:.25em .7em;white-space:nowrap;}
  #hud .stg small{font-weight:700;opacity:.6;margin-right:.4em;}
  #rules{display:flex;flex-wrap:wrap;gap:6px;flex:1;}
  .chip{font-weight:800;font-size:clamp(12px,2.1vmin,16px);background:rgba(255,255,255,.88);border:2px solid #2b3440;border-radius:10px;padding:.25em .6em;white-space:nowrap;}
  .chip b{font-size:1.25em;font-variant-numeric:tabular-nums;}
  .chip.warn{background:#ffe1d6;}
  .chip.ok{background:#e3f6d8;}
  #neckbar{display:inline-block;vertical-align:middle;height:.7em;width:6em;border:2px solid #2b3440;border-radius:1em;margin-left:.4em;overflow:hidden;background:#fff;position:relative;}
  #neckbar i{position:absolute;left:0;top:0;bottom:0;background:#f7c9a3;}
  #neckbar u{position:absolute;top:-2px;bottom:-2px;width:2px;background:#c0392b;}

  .ui-btn{position:fixed;pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:800;color:#2b3440;
          border:2px solid #2b3440;background:rgba(255,255,255,.9);border-radius:2em;box-shadow:0 3px 0 #2b3440;}
  .ui-btn:active{transform:translateY(2px);box-shadow:0 1px 0 #2b3440;}
  #mute{top:max(8px,env(safe-area-inset-top));right:max(12px,env(safe-area-inset-right));font-size:13px;padding:.35em .8em;box-shadow:none;}
  #retry{left:max(12px,env(safe-area-inset-left));bottom:max(12px,env(safe-area-inset-bottom));font-size:16px;padding:.65em 1.1em;}
  #retry.pulse{animation:pulse 1s infinite;background:#ffe9a8;}
  @keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
  #menu{left:max(12px,env(safe-area-inset-left));bottom:max(68px,calc(env(safe-area-inset-bottom) + 58px));font-size:12px;padding:.4em .9em;box-shadow:none;}
  #pad{position:fixed;right:max(12px,env(safe-area-inset-right));bottom:max(12px,env(safe-area-inset-bottom));width:150px;height:150px;pointer-events:none;}
  #pad button{position:absolute;width:52px;height:52px;border-radius:14px;pointer-events:auto;font-size:22px;font-weight:900;font-family:inherit;
              border:2px solid #2b3440;background:rgba(255,255,255,.85);color:#2b3440;box-shadow:0 3px 0 #2b3440;}
  #pad button:active{transform:translateY(2px);box-shadow:0 1px 0 #2b3440;background:#ffe9a8;}
  #pad .u{left:49px;top:0}#pad .d{left:49px;bottom:0}#pad .l{left:0;top:49px}#pad .r{right:0;top:49px}

  #hint{position:fixed;left:0;right:0;bottom:max(16px,env(safe-area-inset-bottom));text-align:center;pointer-events:none;
        font-size:clamp(12px,2vmin,16px);font-weight:800;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 8px #fff;transition:opacity .5s;padding:0 170px;}

  .screen{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;text-align:center;pointer-events:none;}
  #title{justify-content:flex-start;padding-top:max(5vh,env(safe-area-inset-top));}
  #title h1{font-size:clamp(32px,8vmin,80px);font-weight:800;letter-spacing:.08em;color:#2b3440;
            text-shadow:0 4px 0 #fff,0 0 18px rgba(255,255,255,.9);line-height:1.15;}
  #title h1 .nb{display:inline-block;transform:scaleX(1.55);margin:0 .32em;}
  #title .en{font-size:clamp(10px,1.6vmin,13px);letter-spacing:.35em;opacity:.6;margin:.3em 0 1em;font-weight:700;}
  .big-btn{pointer-events:auto;cursor:pointer;font-family:inherit;font-weight:800;font-size:clamp(16px,3vmin,24px);
           letter-spacing:.12em;padding:.55em 1.7em;border:3px solid #2b3440;border-radius:.6em;background:#fff8e6;color:#2b3440;
           box-shadow:0 5px 0 #2b3440;}
  .big-btn:active{transform:translateY(3px);box-shadow:0 2px 0 #2b3440;}
  .big-btn.sub{background:#fff;font-size:clamp(13px,2.3vmin,18px);padding:.45em 1.2em;}
  #sel{display:grid;grid-template-columns:repeat(5,auto);gap:8px;margin-top:1em;pointer-events:auto;}
  #sel button{font-family:inherit;font-weight:800;font-size:clamp(13px,2.4vmin,18px);width:2.6em;height:2.6em;border-radius:.5em;cursor:pointer;
              border:2px solid #2b3440;background:#fff;color:#2b3440;box-shadow:0 3px 0 #2b3440;position:relative;}
  #sel button.done{background:#e3f6d8;}
  #sel button.done::after{content:'✓';position:absolute;right:-.35em;top:-.5em;font-size:.8em;color:#2e8b3a;}
  #sel button:disabled{opacity:.35;cursor:default;}
  #title .note{margin-top:1em;font-size:clamp(11px,1.7vmin,14px);line-height:1.8;opacity:.8;font-weight:700;text-shadow:0 0 3px #fff,0 0 3px #fff;}

  #card{justify-content:flex-start;padding-top:max(64px,calc(env(safe-area-inset-top) + 56px));}
  #card .box{background:rgba(255,253,245,.95);border:3px solid #2b3440;border-radius:16px;padding:1em 1.8em 1.2em;
             box-shadow:0 6px 0 rgba(43,52,64,.85);animation:pop .45s cubic-bezier(.2,1.6,.4,1);pointer-events:auto;max-width:92vw;}
  #card .c1{font-size:clamp(24px,5.6vmin,52px);font-weight:800;letter-spacing:.05em;}
  #card .c2{font-size:clamp(15px,3vmin,26px);font-weight:800;margin-top:.35em;color:#c0392b;}
  #card .c3{font-size:clamp(13px,2.3vmin,19px);font-weight:700;margin-top:.3em;}
  #card .c4{font-size:clamp(12px,2vmin,16px);opacity:.7;margin-top:.5em;font-weight:700;}
  #card .btns{display:flex;gap:12px;justify-content:center;margin-top:1em;flex-wrap:wrap;}
  @media (orientation:portrait){#hint{padding:0 16px;bottom:max(176px,calc(env(safe-area-inset-bottom) + 166px));}}
  @media (orientation:landscape) and (pointer:fine){#hint{padding:0 16px;}}
  @keyframes pop{0%{transform:scale(.4);opacity:0}100%{transform:scale(1);opacity:1}}
</style>
</head>
<body>
<canvas id="cv"></canvas>

<div id="hud" class="hide">
  <div class="stg" id="stg"></div>
  <div id="rules"></div>
</div>
<div id="hint" class="hide"></div>
<button id="retry" class="ui-btn hide">↺ やりなおす</button>
<button id="menu" class="ui-btn hide">ステージ選択</button>
<div id="pad" class="hide"><button class="u" data-d="U">▲</button><button class="l" data-d="L">◀</button><button class="r" data-d="R">▶</button><button class="d" data-d="D">▼</button></div>
<button id="mute" class="ui-btn">♪ ON</button>

<div id="title" class="screen">
  <h1>首を<span class="nb">長</span>くして待つ</h1>
  <div class="en">KUBI WO NAGAKU SHITE MATSU</div>
  <button id="start" class="big-btn">待ちはじめる</button>
  <div id="sel"></div>
  <div class="note">頭を動かすと、そのぶん首が伸びる。首は縮められない。<br>PC：矢印キー / WASD　R：やりなおす　　スマホ：スワイプ / ボタン</div>
</div>

<div id="card" class="screen hide">
  <div class="box">
    <div class="c1" id="c1"></div>
    <div class="c2" id="c2"></div>
    <div class="c3" id="c3"></div>
    <div class="c4" id="c4"></div>
    <div class="btns" id="cbtns"></div>
  </div>
</div>

<script>
(function(){
'use strict';
const $=id=>document.getElementById(id);
const cv=$('cv'), g=cv.getContext('2d');
const el={hud:$('hud'),stg:$('stg'),rules:$('rules'),hint:$('hint'),retry:$('retry'),menu:$('menu'),pad:$('pad'),mute:$('mute'),
          title:$('title'),start:$('start'),sel:$('sel'),card:$('card'),c1:$('c1'),c2:$('c2'),c3:$('c3'),c4:$('c4'),cbtns:$('cbtns')};

/* =========================================================
   基本
   ========================================================= */
let W=0,H=0,DPR=1;
function resize(){
  DPR=Math.min(2,window.devicePixelRatio||1);
  W=window.innerWidth; H=window.innerHeight;
  cv.width=Math.round(W*DPR); cv.height=Math.round(H*DPR);
}
window.addEventListener('resize',resize);
window.addEventListener('orientationchange',()=>setTimeout(resize,150));
resize();

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ease=t=>{t=clamp(t,0,1);return t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2;};
const easeOut=t=>{t=clamp(t,0,1);return 1-Math.pow(1-t,3);};
const easeBack=t=>{t=clamp(t,0,1);const c=2.2;return 1+(c+1)*Math.pow(t-1,3)+c*Math.pow(t-1,2);};
function hash(a,b){const s=Math.sin(a*127.1+b*311.7)*43758.5453;return s-Math.floor(s);}
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function hex2rgb(h){const n=parseInt(h.slice(1),16);return[n>>16&255,n>>8&255,n&255];}
function mix(a,b,t){const A=hex2rgb(a),B=hex2rgb(b);return'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],t))).join(',')+')';}
function rr(x,y,w,h,r){g.beginPath();g.moveTo(x+r,y);g.arcTo(x+w,y,x+w,y+h,r);g.arcTo(x+w,y+h,x,y+h,r);
  g.arcTo(x,y+h,x,y,r);g.arcTo(x,y,x+w,y,r);g.closePath();}
function circ(x,y,r){g.beginPath();g.arc(x,y,r,0,Math.PI*2);}
function fmt(n){return Math.floor(n).toLocaleString('ja-JP');}

const C=64;                 // 1マスの大きさ
let S=1;                    // 吹き出しの文字の大きさ
const M_PER_CELL=3;         // 1マス＝3m（ということにする）
const NECK_W=22;
const SKIN='#f7d4b5', LINE='#5b3d30', HAIR='#3b2a22';
const FONT='"Hiragino Maru Gothic ProN","Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif';

/* =========================================================
   音（Web Audio API で合成）
   ========================================================= */
const AU={ctx:null,master:null,music:null,sfx:null,noise:null,muted:false,stretch:null,stretchG:null};
function au(){
  if(!AU.ctx){
    try{
      const C=window.AudioContext||window.webkitAudioContext; AU.ctx=new C();
      AU.master=AU.ctx.createGain(); AU.master.gain.value=AU.muted?0:.7; AU.master.connect(AU.ctx.destination);
      AU.music=AU.ctx.createGain(); AU.music.gain.value=.32; AU.music.connect(AU.master);
      AU.sfx=AU.ctx.createGain(); AU.sfx.gain.value=.9; AU.sfx.connect(AU.master);
      const len=AU.ctx.sampleRate; const b=AU.ctx.createBuffer(1,len,AU.ctx.sampleRate); const d=b.getChannelData(0);
      for(let i=0;i<len;i++) d[i]=Math.random()*2-1; AU.noise=b;
      // 首が伸びる音（常時鳴らして音量で制御）
      const o=AU.ctx.createOscillator(); o.type='triangle'; o.frequency.value=200;
      const gn=AU.ctx.createGain(); gn.gain.value=0; o.connect(gn); gn.connect(AU.sfx); o.start();
      AU.stretch=o; AU.stretchG=gn;
    }catch(e){AU.ctx=null;}
  }
  if(AU.ctx&&AU.ctx.state==='suspended') AU.ctx.resume();
  return AU.ctx;
}
const mf=m=>440*Math.pow(2,(m-69)/12);
function tone(f,dur,o){
  const c=AU.ctx; if(!c) return; o=o||{};
  const t=(o.t!=null?o.t:c.currentTime)+(o.at||0);
  const osc=c.createOscillator(), gn=c.createGain();
  osc.type=o.type||'sine'; osc.frequency.setValueAtTime(f,t);
  if(o.to) osc.frequency.exponentialRampToValueAtTime(o.to,t+dur);
  if(o.vib){const l=c.createOscillator(),lg=c.createGain();l.frequency.value=o.vib[0];lg.gain.value=o.vib[1];
    l.connect(lg);lg.connect(osc.frequency);l.start(t);l.stop(t+dur+.05);}
  const v=o.vol||.2, a=o.attack||.008;
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(v,t+a);
  gn.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  osc.connect(gn); gn.connect(o.bus||AU.sfx); osc.start(t); osc.stop(t+dur+.05);
}
function noise(dur,o){
  const c=AU.ctx; if(!c) return; o=o||{};
  const t=c.currentTime+(o.at||0);
  const s=c.createBufferSource(); s.buffer=AU.noise;
  const f=c.createBiquadFilter(); f.type=o.ft||'bandpass'; f.frequency.value=o.f||1000; f.Q.value=o.q||1;
  const gn=c.createGain(); const v=o.vol||.2, a=o.attack||.005;
  gn.gain.setValueAtTime(0.0001,t); gn.gain.linearRampToValueAtTime(v,t+a); gn.gain.exponentialRampToValueAtTime(0.0005,t+dur);
  s.connect(f); f.connect(gn); gn.connect(o.bus||AU.sfx); s.start(t,Math.random()*.5); s.stop(t+dur+.05);
}
const SFX={
  nyu(){tone(240,.38,{type:'triangle',to:1100,vol:.28});tone(480,.38,{to:2200,vol:.05});},
  boing(){tone(420,.5,{to:140,vol:.3,vib:[17,40]});},
  gon(){tone(150,.2,{type:'square',to:70,vol:.1});noise(.12,{ft:'lowpass',f:500,vol:.3});tone(95,.35,{vol:.3,to:60});},
  gwan(){tone(520,.8,{type:'triangle',vol:.12});tone(781,.7,{type:'triangle',vol:.08});tone(1203,.5,{vol:.04});noise(.08,{ft:'highpass',f:2000,vol:.1});},
  zap(){const c=AU.ctx;if(!c)return;const t=c.currentTime;const o=c.createOscillator(),gn=c.createGain(),l=c.createOscillator(),lg=c.createGain();
    o.type='sawtooth';o.frequency.value=82;l.type='square';l.frequency.value=34;lg.gain.value=.09;gn.gain.value=.09;
    l.connect(lg);lg.connect(gn.gain);o.connect(gn);gn.connect(AU.sfx);
    gn.gain.setValueAtTime(.09,t);gn.gain.linearRampToValueAtTime(0,t+.55);o.start(t);l.start(t);o.stop(t+.6);l.stop(t+.6);
    noise(.45,{ft:'highpass',f:3500,vol:.07});},
  fuwa(){tone(500,.45,{to:900,vol:.12,attack:.08});tone(750,.45,{to:1300,vol:.05,attack:.1});},
  fasa(){noise(.35,{f:1800,q:.7,vol:.3,attack:.04});tone(300,.2,{to:200,vol:.05});},
  peta(){noise(.08,{ft:'lowpass',f:900,vol:.22});},
  birds(){for(let i=0;i<5;i++) tone(2400+Math.random()*700,.06,{at:i*.07,to:3300+Math.random()*500,vol:.07});
    noise(.35,{f:1100,q:.6,vol:.12});},
  chirp(){tone(2800,.05,{to:3600,vol:.05});tone(3000,.05,{at:.09,to:3800,vol:.04});},
  shutter(){noise(.03,{ft:'highpass',f:4000,vol:.06});noise(.03,{at:.06,ft:'highpass',f:3000,vol:.05});},
  pop(){tone(700,.1,{to:1400,vol:.12});},
  talk(){tone(520+Math.random()*120,.05,{type:'square',vol:.025});},
  doh(){tone(1000,.95,{type:'sawtooth',to:110,vol:.14});tone(1400,.8,{type:'square',to:220,vol:.05});
    noise(.7,{f:900,q:.5,vol:.25});tone(70,.5,{vol:.35,to:40});},
  clear(){const c=AU.ctx;if(!c)return;[72,76,79,84].forEach((m,i)=>tone(mf(m),i===3?1.1:.22,{type:'triangle',at:i*.13,vol:.18}));
    [60,64,67].forEach(m=>tone(mf(m),1.2,{type:'triangle',at:.39,vol:.07}));}
};
// BGM：軽快で牧歌的な8小節ループ
const MEL=[76,0,79,0,81,79,76,0, 74,0,72,0,74,76,0,0, 72,0,74,76,77,0,76,74, 71,0,74,0,79,0,0,0,
           76,0,79,0,84,0,81,79, 76,0,74,76,79,0,0,0, 77,0,76,74,72,0,74,0, 72,0,0,0,0,0,0,0];
const CH=[[60,64,67],[57,60,64],[53,57,60],[55,59,62],[60,64,67],[52,55,59],[53,57,60],[60,64,67]];
const BGM={on:false,step:0,next:0,timer:null};
function bgmStart(){
  const c=au(); if(!c||BGM.on) return;
  BGM.on=true; BGM.step=0; BGM.next=c.currentTime+.1;
  BGM.timer=setInterval(()=>{
    const sd=60/112/2;
    while(BGM.next<AU.ctx.currentTime+.18){
      const s=BGM.step,t=BGM.next,m=MEL[s],bar=s>>3,b=s&7,ch=CH[bar];
      if(m){tone(mf(m),.26,{type:'triangle',t,vol:.13,bus:AU.music});tone(mf(m+12),.12,{t,vol:.02,bus:AU.music});}
      if(b===0||b===4) tone(mf(ch[0]-12-(b===4?5:0)),.34,{t,vol:.26,bus:AU.music});
      if(b===2||b===6) ch.forEach(n=>tone(mf(n),.13,{type:'square',t,vol:.022,bus:AU.music}));
      BGM.next+=sd; BGM.step=(s+1)%64;
    }
  },25);
}
function musicVol(v,tc){if(AU.ctx) AU.music.gain.setTargetAtTime(v,AU.ctx.currentTime,tc||.3);}
Object.assign(SFX,{
  step(n){tone(330+Math.min(n,24)*22,.09,{type:'triangle',to:420+Math.min(n,24)*26,vol:.13});noise(.04,{ft:'lowpass',f:700,vol:.05});},
  nope(){tone(260,.16,{type:'square',to:200,vol:.05});},
  retract(){tone(900,.45,{type:'triangle',to:160,vol:.16});noise(.4,{f:1500,q:.8,vol:.08});},
  stuck(){tone(392,.25,{type:'triangle',vol:.1});tone(330,.35,{type:'triangle',at:.2,vol:.1});tone(262,.5,{type:'triangle',at:.45,vol:.1});}
});


/* =========================================================
   ルール（一筆書き）
   ========================================================= */
const DIRS={R:[1,0],L:[-1,0],U:[0,-1],D:[0,1]};
const WALLS='#KTbg';
const ARROW={'>':'R','<':'L','^':'U','v':'D'};
const axOf=d=>(d==='R'||d==='L')?'h':'v';
function loadStage(st){
  const m=st.map.map(r=>[...r]);const Hh=m.length,Ww=m[0].length;let s,gl;
  for(let y=0;y<Hh;y++)for(let x=0;x<Ww;x++){if(m[y][x]==='S')s=[x,y];if(m[y][x]==='G')gl=[x,y];}
  return{m,W:Ww,H:Hh,s,g:gl,len:st.len,min:st.min||0,gd:st.gd,turns:st.turns==null?null:st.turns};
}
function newRun(L){return{path:[L.s.slice()],dirs:[],occ:new Map([[L.s[0]+','+L.s[1],['s']]]),turns:0};}
// 動けない理由（null なら動ける）
function whyNot(L,R,d){
  const p=R.path[R.path.length-1],nx=p[0]+DIRS[d][0],ny=p[1]+DIRS[d][1];
  if(nx<0||ny<0||nx>=L.W||ny>=L.H)return'edge';
  const t=L.m[ny][nx];
  if(WALLS.includes(t))return'wall';
  if(t==='S')return'self';
  const last=R.dirs.length?R.dirs[R.dirs.length-1]:null, ct=L.m[p[1]][p[0]];
  if(ct==='+'&&last&&d!==last)return'bridge';
  const o=R.occ.get(nx+','+ny);
  if(t==='+'){if(o&&(o.length>=2||o[0]===axOf(d)))return'self';}
  else if(o)return'self';
  if(t in ARROW&&ARROW[t]!==d)return'oneway';
  if(R.path.length-1>=L.len)return'len';
  if(L.turns!=null&&last&&d!==last&&R.turns>=L.turns)return'turn';
  if(t==='G'&&d!==L.gd)return'face';
  if(t==='G'&&R.path.length<L.min)return'short';
  return null;
}
function doMove(L,R,d){
  const p=R.path[R.path.length-1],n=[p[0]+DIRS[d][0],p[1]+DIRS[d][1]],k=n[0]+','+n[1];
  const last=R.dirs.length?R.dirs[R.dirs.length-1]:null;
  if(last&&last!==d)R.turns++;
  R.path.push(n);R.dirs.push(d);
  if(!R.occ.has(k))R.occ.set(k,[]);R.occ.get(k).push(axOf(d));
}
function atGoal(L,R){const p=R.path[R.path.length-1];return p[0]===L.g[0]&&p[1]===L.g[1];}
function legalMoves(L,R){return['R','L','U','D'].filter(d=>!whyNot(L,R,d));}
// 検証用ソルバー（全ステージに解があることを確認するのに使う）
function solveStage(st,cap){
  const L=loadStage(st),R=newRun(L),sols=[];cap=cap||1;
  const dist=new Map(),q=[L.g];dist.set(L.g+'',0);
  while(q.length){const c=q.shift();for(const v of Object.values(DIRS)){const n=[c[0]+v[0],c[1]+v[1]];
    if(n[0]<0||n[1]<0||n[0]>=L.W||n[1]>=L.H||WALLS.includes(L.m[n[1]][n[0]])||L.m[n[1]][n[0]]==='S'||dist.has(n+''))continue;
    dist.set(n+'',dist.get(c+'')+1);q.push(n);}}
  (function rec(){
    if(sols.length>=cap)return;
    if(atGoal(L,R)){sols.push(R.dirs.join(''));return;}
    const rem=L.len-(R.path.length-1);
    for(const d of legalMoves(L,R)){
      const p=R.path[R.path.length-1],n=[p[0]+DIRS[d][0],p[1]+DIRS[d][1]],dd=dist.get(n+'');
      if(dd==null||dd>rem-1)continue;
      doMove(L,R,d);rec();
      const b=R.path.pop(),bd=R.dirs.pop(),k=b[0]+','+b[1],a=R.occ.get(k);a.pop();if(!a.length)R.occ.delete(k);
      const last=R.dirs.length?R.dirs[R.dirs.length-1]:null;if(last&&last!==bd)R.turns--;
    }
  })();
  return sols;
}

  au(); if(e.pointerType!=='mouse'&&!isTouch){isTouch=true;if(G.scene==='play')el.pad.classList.remove('hide');}

  tp.id=e.pointerId; tp.ax=e.clientX; tp.ay=e.clientY; tp.moved=false; tp.t0=performance.now();
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
});
cv.addEventListener('pointermove',e=>{
  if(tp.id!==e.pointerId||G.scene!=='play') return;
  const T=Math.max(26,C*G.cam.z*.55);
  let dx=e.clientX-tp.ax,dy=e.clientY-tp.ay;
  while(Math.abs(dx)>=T||Math.abs(dy)>=T){
    if(Math.abs(dx)>=Math.abs(dy)){push(dx>0?'R':'L');tp.ax+=Math.sign(dx)*T;}
    else{push(dy>0?'D':'U');tp.ay+=Math.sign(dy)*T;}
    tp.moved=true; dx=e.clientX-tp.ax; dy=e.clientY-tp.ay;
  }
});
cv.addEventListener('pointerup',e=>{
  if(tp.id!==e.pointerId) return; tp.id=null;
  if(G.scene!=='play'||tp.moved||performance.now()-tp.t0>500) return;
  // タップ：頭のとなりのマスなら、そこへ進む
  const w=s2w(e.clientX,e.clientY),L=G.L,p=G.R.path[G.R.path.length-1];

  turn:['首がこって曲がれない'],face:['正面から行こう'],short:['まだ首が短い'],bridge:['歩道橋はまっすぐ']};
function tryMove(d){
  const L=G.L,R=G.R,why=whyNot(L,R,d);
  if(why){
    G.bump={d,t:0}; G.queue.length=0;
    const h=G.head; const w=WHY[why]; let txt=w[Math.floor(Math.random()*w.length)];
    if(why==='short') txt='まだ首が短い（あと'+(L.min-R.path.length)+'マス）';
    popup(h.x+DIRS[d][0]*26,h.y+DIRS[d][1]*26-10,txt,why==='wall'||why==='edge'?'#fff':'#ffe14d',why==='wall'?1:.8);
    if(why==='wall'||why==='edge'){SFX.boing(); h.dizzy=.5;} else SFX.nope();
    h.sqv+=3;
    return;
  }
  const p=R.path[R.path.length-1];
  doMove(L,R,d);
  const n=R.path[R.path.length-1];
  G.anim={from:cellC(p[0],p[1]),to:cellC(n[0],n[1]),t:0,d};
  if(d==='R')G.head.face=1; else if(d==='L')G.head.face=-1;
  SFX.step(R.path.length);
  G.hintT+=1; if(G.hintT>2) hideHint();
  updateHud();
}
function afterMove(){
  const L=G.L,R=G.R;
  if(atGoal(L,R)){clearStage();return;}
  if(!legalMoves(L,R).length){
    G.stuck=true; G.stuckT=0; el.retry.classList.add('pulse');
    SFX.stuck();
    setTimeout(()=>{if(G.stuck&&G.scene==='play') say('me',['……','詰んだかな','まあ、待つか','首が……'][Math.floor(Math.random()*4)],2.2);},350);
  }
}

  if(G.scene==='clear'){el.card.classList.add('hide'); G.scene='play'; loadLevel(G.idx); return;}
  if(G.scene!=='play'||G.retract||G.intro) return;
  if(G.R.path.length<=1){G.head.sqv+=3; return;}
  G.retract={t:0,dur:Math.min(.55,.18+G.R.path.length*.015)}; G.queue.length=0; G.anim=null; G.bubbles.length=0;

   更新
   ========================================================= */
function update(dt){
  G.time+=dt; G.shake=Math.max(0,G.shake-dt*1.5); G.introT+=dt;
  const h=G.head;
  if(G.scene==='play'){
    updateHeld(dt);
    if(G.intro){
      const it=G.intro,t0=it.t; it.t+=dt; const at=x=>t0<x&&it.t>=x;
      if(at(.6)) say('me','遅いなあ……',1.9);
      if(at(2.6)) say('me','首を長くして待つか……',2.0);
      if(at(4.8)){tryMove('U'); SFX.nyu(); popup(G.head.x+30,G.head.y-40,'にゅっ','#fff',1.4);}
      if(it.t>=5.0){G.intro=null;}
    }
    if(G.retract){
      G.retract.t+=dt;
      if(G.retract.t>=G.retract.dur){loadLevel(G.idx);SFX.pop();}
    }else{
      if(G.anim){G.anim.t+=dt/.09; if(G.anim.t>=1){G.anim=null;afterMove();}}
      if(!G.anim&&G.queue.length&&G.scene==='play') tryMove(G.queue.shift());
    }
    if(G.stuck) G.stuckT+=dt;
  }else if(G.scene==='clear'||G.scene==='ending'){G.clearT+=dt;}
  if(G.bump){G.bump.t+=dt/.22; if(G.bump.t>=1)G.bump=null;}
  // 頭の位置
  const L=G.L,R=G.R; const p=R.path[R.path.length-1];
  let hp=cellC(p[0],p[1]);
  if(G.anim){const e=easeOut(G.anim.t);hp={x:lerp(G.anim.from.x,G.anim.to.x,e),y:lerp(G.anim.from.y,G.anim.to.y,e)};}
  if(G.scene==='clear'||(G.scene==='ending')){
    // 待ち人の正面でとまる
    const d=DIRS[L.gd],e=easeBack(Math.min(1,G.clearT/.3)),a=cellC(L.g[0]-d[0],L.g[1]-d[1]);
    hp={x:a.x+d[0]*C*.3*e,y:a.y+d[1]*C*.3*e};
  }
  if(G.bump){const k=Math.sin(G.bump.t*Math.PI)*9;hp={x:hp.x+DIRS[G.bump.d][0]*k,y:hp.y+DIRS[G.bump.d][1]*k};}
  h.x=hp.x; h.y=hp.y;
  h.dizzy=Math.max(0,h.dizzy-dt);
  h.sqv+=(-h.sq*120-h.sqv*9)*dt; h.sq+=h.sqv*dt;
  h.blinkT-=dt; if(h.blinkT<-.12) h.blinkT=2+Math.random()*3;
  const ld=G.R.dirs.length?G.R.dirs[G.R.dirs.length-1]:'U';
  h.lookX=lerp(h.lookX,DIRS[ld][0]*h.face,dt*8); h.lookY=lerp(h.lookY,DIRS[ld][1],dt*8);
  h.tilt=lerp(h.tilt,(ld==='U'?-.12:ld==='D'?.12:0)*h.face,dt*6);
  G.gulpT+=dt;
  fitCamera(false,dt);
  for(const pp of G.popups) pp.t+=dt; G.popups=G.popups.filter(pp=>pp.t<1.1);
  for(const b of G.bubbles) b.t+=dt; G.bubbles=G.bubbles.filter(b=>b.t<b.dur);

function fitCamera(snap,dt){
  const L=G.L;
  const bx0=-C*.7,bx1=L.W*C+C*.7,by0=-L.H*C-C*1.15,by1=C*.55;
  const top=G.scene==='title'?H*.6:el.hud.classList.contains('hide')?20:58, padB=(isTouch&&G.scene==='play')?(W<H?170:24):24;
  const sideR=(isTouch&&G.scene==='play'&&W>=H)?170:0, sideL=(isTouch&&G.scene==='play'&&W>=H)?110:0;
  const aw=W-sideL-sideR-16, ah=H-top-padB;
  let z=Math.min(aw/(bx1-bx0),ah/(by1-by0));
  z=Math.min(z,1.9);
  const cx=(bx0+bx1)/2 - (sideL-sideR)/2/z, cy=(by0+by1)/2 - (top-padB)/2/z;
  if(snap){G.cam.x=cx;G.cam.y=cy;G.cam.z=z;}
  else{const k=Math.min(1,(dt||0)*6);G.cam.x=lerp(G.cam.x,cx,k);G.cam.y=lerp(G.cam.y,cy,k);G.cam.z=lerp(G.cam.z,z,k);}

/* =========================================================
   首の描画（角は丸く、ゆらゆら、ときどき「ごくん」）
   ========================================================= */
function neckSource(){
  const R=G.R,pts=[rootPt()];
  for(let i=0;i<R.path.length;i++){const p=R.path[i];pts.push(cellC(p[0],p[1]));}
  pts[pts.length-1]={x:G.head.x,y:G.head.y};
  if(G.scene==='clear'||G.scene==='ending'){/* 最後の点は頭の位置 */}
  // 歩道橋を2回目に通るところで分割（上を通る首を手前に描く）
  const cuts=[];const seen=new Set();
  for(let i=0;i<R.path.length;i++){const p=R.path[i],k=p[0]+','+p[1];
    if(G.L.m[p[1]][p[0]]==='+'){if(seen.has(k))cuts.push(i+1);else seen.add(k);}}
  return{pts,cuts};
}
function densify(pts){
  // 角を丸めた細かい点列
  const out=[];const R0=C*.42;
  out.push({x:pts[0].x,y:pts[0].y,src:0});
  for(let i=1;i<pts.length;i++){
    const a=pts[i-1],b=pts[i],c=pts[i+1];
    const inL=Math.hypot(b.x-a.x,b.y-a.y);
    if(!c){pushLine(out,b,i);break;}
    const outL=Math.hypot(c.x-b.x,c.y-b.y);
    const ix=(b.x-a.x)/(inL||1),iy=(b.y-a.y)/(inL||1),ox=(c.x-b.x)/(outL||1),oy=(c.y-b.y)/(outL||1);
    if(Math.abs(ix*ox+iy*oy)>.99||inL<1||outL<1){pushLine(out,b,i);continue;}
    const r=Math.min(R0,inL*(i===1?1:.5),outL*(i===pts.length-2?1:.5));
    const p1={x:b.x-ix*r,y:b.y-iy*r},p2={x:b.x+ox*r,y:b.y+oy*r};
    pushLine(out,p1,i);
    for(let k=1;k<=6;k++){const t=k/6,u=1-t;out.push({x:u*u*p1.x+2*u*t*b.x+t*t*p2.x,y:u*u*p1.y+2*u*t*b.y+t*t*p2.y,src:i});}
  }
  return out;
}
function pushLine(out,b,src){
  const a=out[out.length-1],L=Math.hypot(b.x-a.x,b.y-a.y),n=Math.max(1,Math.ceil(L/7));
  for(let k=1;k<=n;k++)out.push({x:lerp(a.x,b.x,k/n),y:lerp(a.y,b.y,k/n),src});
}
function drawNeck(){
  const {pts,cuts}=neckSource();
  let dense=densify(pts);
  // 弧長
  let s=0;dense[0].s=0;for(let i=1;i<dense.length;i++){s+=Math.hypot(dense[i].x-dense[i-1].x,dense[i].y-dense[i-1].y);dense[i].s=s;}
  let total=s;
  // やりなおし中は先から縮む
  let cut=total;
  if(G.retract){cut=total*(1-ease(G.retract.t/G.retract.dur));}
  // ゆらぎ（根元と先は固定）
  const wob=[];
  for(let i=0;i<dense.length;i++){
    const d=dense[i],a=dense[Math.max(0,i-1)],b=dense[Math.min(dense.length-1,i+1)];
    let tx=b.x-a.x,ty=b.y-a.y;const tl=Math.hypot(tx,ty)||1;tx/=tl;ty/=tl;
    const tp=Math.min(1,d.s/40)*Math.min(1,(total-d.s)/40);
    const amp=1.6*tp*Math.sin(G.time*3+d.s*.05);
    wob.push({x:d.x-ty*amp,y:d.y+tx*amp,s:d.s,src:d.src});
  }
  // ごくん（こぶが根元から頭へ）
  const GP=2.6,gt=(G.gulpT%GP)/1.4;
  const gulpS=gt<1?total*gt:-1;
  // チャンクに分けて描く
  const chunks=[];let cur=[];
  const cutSrc=new Set(cuts); // pts 上の添字
  for(let i=0;i<wob.length;i++){
    const p=wob[i];if(p.s>cut){ // 途中で切る
      const q=wob[i-1];if(q){const t=(cut-q.s)/((p.s-q.s)||1);cur.push({x:lerp(q.x,p.x,t),y:lerp(q.y,p.y,t)});}
      break;}
    if(i>0&&cutSrc.has(p.src)&&!cutSrc.has(wob[i-1].src)&&cur.length>1){
      // 歩道橋の手前の境目で切る（直進部分なのでつなぎ目は目立たない）
      chunks.push(cur);cur=[wob[i-1]];
    }
    cur.push(p);
  }
  if(cur.length>1)chunks.push(cur);
  const endPt=cur.length?cur[cur.length-1]:wob[0];
  g.lineJoin='round';
  for(const ch of chunks){
    g.beginPath();g.moveTo(ch[0].x,ch[0].y);for(let i=1;i<ch.length;i++)g.lineTo(ch[i].x,ch[i].y);
    g.lineCap='butt';
    g.strokeStyle=LINE;g.lineWidth=NECK_W+5;g.stroke();
    g.strokeStyle=SKIN;g.lineWidth=NECK_W;g.stroke();
    g.save();g.translate(-2,-3);g.strokeStyle='rgba(255,255,255,.42)';g.lineWidth=4;g.stroke();g.restore();
    // しわ（ところどころ）
    g.strokeStyle='rgba(150,95,70,.35)';g.lineWidth=1.5;
    for(let i=4;i<ch.length-2;i+=9){const a=ch[i-1],b=ch[i+1],tx=b.x-a.x,ty=b.y-a.y,tl=Math.hypot(tx,ty)||1;
      const nx=-ty/tl,ny=tx/tl;g.beginPath();g.moveTo(ch[i].x+nx*7,ch[i].y+ny*7);g.quadraticCurveTo(ch[i].x+tx/tl*3,ch[i].y+ty/tl*3,ch[i].x-nx*7,ch[i].y-ny*7);g.stroke();}
  }
  // ごくん
  if(gulpS>0&&gulpS<cut-20&&!G.retract){
    let i=0;while(i<wob.length-1&&wob[i].s<gulpS)i++;
    const p=wob[i];g.fillStyle=SKIN;g.strokeStyle=LINE;g.lineWidth=2.5;
    g.beginPath();g.ellipse(p.x,p.y,NECK_W*.78,NECK_W*.78,0,0,Math.PI*2);g.fill();g.stroke();
    g.fillStyle='rgba(255,255,255,.35)';circ(p.x-3,p.y-4,3.5);g.fill();
  }
  return endPt;
}

function drawHead(x,y){
  const h=G.head;
  g.save(); g.translate(x,y); g.rotate(h.tilt+(h.down||0)*h.face);
  const sq=clamp(h.sq,-.25,.25); g.scale((1+sq)*h.face,1-sq);

  g.fillStyle=zap?'#fff36b':LINE; circ(-1,0,22.6); g.fill();
  g.fillStyle=zap?'#333':HAIR; circ(-1,0,21); g.fill();
  if(zap){g.strokeStyle='#333';g.lineWidth=3;for(let a=0;a<8;a++){const r=a/8*Math.PI*2;g.beginPath();g.moveTo(Math.cos(r)*20,Math.sin(r)*20);g.lineTo(Math.cos(r)*30,Math.sin(r)*30);g.stroke();}}
  g.fillStyle=SKIN; g.beginPath(); g.ellipse(3.5,2.5,17,17,0,0,Math.PI*2); g.fill();
  g.fillStyle=zap?'#333':HAIR; g.beginPath(); g.moveTo(-21,2); g.quadraticCurveTo(-20,-23,3,-21.5); g.quadraticCurveTo(19,-20,21,-5);
  g.quadraticCurveTo(13,-12,6,-9); g.quadraticCurveTo(2,-14,-4,-8); g.quadraticCurveTo(-8,-2,-9,6); g.closePath(); g.fill();
  g.fillStyle=SKIN; circ(-7,5,4.5); g.fill(); g.strokeStyle=LINE; g.lineWidth=1.3; g.stroke();
  const lx=h.lookX*h.face*1.6,ly=h.lookY*1.4+(h.down||0)*6;
  g.fillStyle='#2a1f1a';
  if(h.dizzy>0){g.strokeStyle='#2a1f1a';g.lineWidth=1.6;
    for(const ex of[8,16]){g.beginPath();for(let a=0;a<10;a++){const r=a*.7+G.time*10,rad=a*.35;g.lineTo(ex+Math.cos(r)*rad,2+Math.sin(r)*rad);}g.stroke();}}
  else if(h.blinkT<0){g.fillRect(6+lx,2+ly,4.5,1.6);g.fillRect(14+lx,2+ly,4.5,1.6);}
  else{g.beginPath();g.ellipse(8+lx,2+ly,2.1,3,0,0,Math.PI*2);g.fill();g.beginPath();g.ellipse(16+lx,2+ly,2.1,3,0,0,Math.PI*2);g.fill();
    g.fillStyle='#fff';circ(8.6+lx,1+ly,.8);g.fill();circ(16.6+lx,1+ly,.8);g.fill();}
  g.fillStyle='rgba(255,140,140,.45)'; g.beginPath(); g.ellipse(5,10,3.6,2.2,0,0,Math.PI*2); g.fill(); g.beginPath(); g.ellipse(19,9,3,2,0,0,Math.PI*2); g.fill();
  g.strokeStyle='#7a3a2a'; g.lineWidth=1.5; g.beginPath(); g.arc(13,10,2.6,.15*Math.PI,.85*Math.PI); g.stroke();
  if(h.hat){g.save();g.translate(0,-30);g.rotate(-.15);drawCloth(0,0,h.hat,0);g.restore();}
  g.restore();
  if(h.dizzy>0){for(let i=0;i<3;i++){const a=G.time*5+i*2.09;drawStar(x+Math.cos(a)*24,y-26+Math.sin(a)*6,5);}}
}
function drawStar(x,y,r){g.fillStyle='#ffd84a';g.beginPath();for(let i=0;i<10;i++){const a=i/10*Math.PI*2-Math.PI/2,rr2=i%2?r*.45:r;g.lineTo(x+Math.cos(a)*rr2,y+Math.sin(a)*rr2);}g.closePath();g.fill();}
function drawBubble(sx,sy,text,a,isMe){
  const fs=clamp(17*S,14,28); g.font='bold '+fs+'px '+FONT;
  const tw=g.measureText(text).width, pw=tw+fs*1.2, ph=fs*1.9;
  let bx=clamp(sx-pw/2,8,W-pw-8), by=sy-ph-fs*.8;
  if(by<8) by=8;
  g.globalAlpha=a;
  g.fillStyle=isMe?'#fffef6':'#fff'; g.strokeStyle='#2b3440'; g.lineWidth=2.5;
  rr(bx,by,pw,ph,ph*.45); g.fill(); g.stroke();
  const tx=clamp(sx,bx+ph*.5,bx+pw-ph*.5);
  g.beginPath(); g.moveTo(tx-fs*.4,by+ph-1); g.lineTo(clamp(sx,tx-fs,tx+fs),Math.min(sy-4,by+ph+fs*.8)); g.lineTo(tx+fs*.3,by+ph-1); g.closePath(); g.fill(); g.stroke();
  g.fillStyle=isMe?'#fffef6':'#fff'; g.fillRect(tx-fs*.4+2,by+ph-4,fs*.7-2,5);
  g.fillStyle='#2b3440'; g.textAlign='center'; g.textBaseline='middle'; g.fillText(text,bx+pw/2,by+ph/2+1);
  g.textBaseline='alphabetic'; g.globalAlpha=1;
}


function drawWaiterAt(L,reached){
  const gc=cellC(L.g[0],L.g[1]),bc=cellC(L.g[0],L.g[1]+1);
  const feetX=bc.x,feetY=bc.y+C/2;
  const faceDir=L.gd==='R'?-1:L.gd==='L'?1:0; // 正面の向き
  g.save();g.translate(feetX,feetY);g.scale(.74,.74);
  if(faceDir<0) g.scale(-1,1);
  g.fillStyle='rgba(0,0,0,.18)';g.beginPath();g.ellipse(0,2,24,5,0,0,Math.PI*2);g.fill();
  g.strokeStyle='#5a4a3a';g.lineWidth=9;g.lineCap='round';
  g.beginPath();g.moveTo(-4,-42);g.lineTo(-4,-4);g.moveTo(5,-42);g.lineTo(5,-4);g.stroke();
  g.fillStyle='#ef8b6c';rr(-16,-88,32,50,10);g.fill();g.strokeStyle=LINE;g.lineWidth=2.2;g.stroke();
  g.strokeStyle='#ef8b6c';g.lineWidth=8;
  if(reached){g.beginPath();g.moveTo(10,-80);g.lineTo(26,-100);g.stroke();g.fillStyle=SKIN;circ(28,-103,5);g.fill();}
  else{g.beginPath();g.moveTo(10,-80);g.lineTo(18,-62);g.lineTo(14,-74);g.stroke();
    g.fillStyle='#333';rr(9,-86,10,15,2);g.fill();g.fillStyle='#bfefff';g.fillRect(10.5,-84,7,11);g.fillStyle=SKIN;circ(16,-72,5);g.fill();}
  g.restore();
  // 首（ふつうの長さ）
  const hx=gc.x+(reached?DIRS[L.gd][0]*C*.15:0),hy=gc.y+(reached?DIRS[L.gd][1]*C*.15:0);
  g.strokeStyle=LINE;g.lineWidth=NECK_W*.75+4;g.lineCap='round';g.beginPath();g.moveTo(feetX,feetY-60);g.lineTo(hx,hy);g.stroke();
  g.strokeStyle=SKIN;g.lineWidth=NECK_W*.75;g.stroke();
  // 頭
  g.save();g.translate(hx,hy);
  const s=1.12;g.scale(s,s);
  if(faceDir===0) g.rotate(-1.25); // 空を見上げている
  else g.scale(faceDir,1);
  g.fillStyle=LINE;circ(-1,0,21.6);g.fill();g.fillStyle='#7a4a2a';circ(-1,0,20);g.fill();
  g.fillStyle='#7a4a2a';circ(-20,6,8);g.fill();
  g.fillStyle=SKIN;g.beginPath();g.ellipse(3.5,3,16,16,0,0,Math.PI*2);g.fill();
  g.fillStyle='#7a4a2a';g.beginPath();g.moveTo(-20,0);g.quadraticCurveTo(-16,-22,6,-20);g.quadraticCurveTo(20,-16,20,-4);g.quadraticCurveTo(8,-12,-8,-4);g.closePath();g.fill();
  if(reached){
    g.strokeStyle='#222';g.lineWidth=1.6;g.beginPath();g.arc(8,2,2.6,Math.PI*1.1,Math.PI*1.9);g.stroke();g.beginPath();g.arc(17,2,2.6,Math.PI*1.1,Math.PI*1.9);g.stroke();
    g.strokeStyle='#7a3a2a';g.beginPath();g.arc(13,10,3.4,.1*Math.PI,.9*Math.PI);g.stroke();
  }else{
    g.fillStyle='#222';g.fillRect(6,4+(faceDir===0?-2:0),4,1.8);g.fillRect(15,4+(faceDir===0?-2:0),4,1.8);
    g.strokeStyle='#7a3a2a';g.lineWidth=1.4;g.beginPath();g.moveTo(10,12);g.lineTo(15,12);g.stroke();
  }
  g.fillStyle='rgba(255,140,140,.4)';g.beginPath();g.ellipse(6,10,3.2,2,0,0,Math.PI*2);g.fill();
  g.restore();
}
function drawProtag(L){
  const b=cellC(L.s[0],L.s[1]+1);
  g.save();g.translate(b.x,b.y+C/2);g.scale(.74,.74);drawProtagBody();g.restore();
}
function drawProtagCollar(L){
  const b=cellC(L.s[0],L.s[1]+1);
  g.save();g.translate(b.x,b.y+C/2);g.scale(.74,.74);drawCollar();g.restore();
}
function legalDots(){
  if(G.scene!=='play'||G.anim||G.retract) return;
  const R=G.R,p=R.path[R.path.length-1];
  for(const d of legalMoves(G.L,R)){const c=cellC(p[0]+DIRS[d][0],p[1]+DIRS[d][1]);
    g.fillStyle='rgba(255,255,255,'+(.45+.2*Math.sin(G.time*5))+')';circ(c.x,c.y,6);g.fill();}
}

function render(){
  const c=G.cam,z=c.z;
  S=clamp(z,.85,1.3);
  g.setTransform(DPR,0,0,DPR,0,0);
  drawSky();
  const sh=G.shake>0?G.shake*8:0, shx=(Math.random()-.5)*sh, shy=(Math.random()-.5)*sh;
  g.setTransform(DPR*z,0,0,DPR*z,DPR*(W/2-c.x*z+shx),DPR*(H/2-c.y*z+shy));
  drawFar();
  drawGround();
  const L=G.L;
  drawBoard();
  drawProtag(L);
  const reached=G.scene==='clear'||G.scene==='ending';
  if(!reached) drawWaiterAt(L,false);
  const neckEnd=drawNeck();
  drawProtagCollar(L);
  legalDots();
  if(reached) drawWaiterAt(L,true);
  const h=G.head;
  if(G.retract) drawHead(neckEnd.x,neckEnd.y); // 縮んでいく首の先についていく
  else drawHead(h.x,h.y);
  // 画面座標の文字
  g.setTransform(DPR,0,0,DPR,0,0);
  for(const p of G.popups){
    const s=w2s(p.x,p.y),e=easeOut(p.t/.3),fs=clamp(20*z*p.size*(.6+.4*e),13,40);
    g.globalAlpha=p.t>.75?1-(p.t-.75)/.35:1;
    g.font='bold '+fs+'px '+FONT;g.textAlign='center';
    const x=s.x+p.dx*e,y=s.y-30*e-p.t*16;
    g.lineWidth=fs*.22;g.strokeStyle='#2b3440';g.lineJoin='round';g.strokeText(p.text,x,y);g.fillStyle=p.col;g.fillText(p.text,x,y);
    g.globalAlpha=1;
  }
  for(const b of G.bubbles){
    let ax,ay;
    if(b.who==='me'){ax=h.x;ay=h.y-28;}else{const gc=cellC(L.g[0],L.g[1]);ax=gc.x;ay=gc.y-28;}
    const s=w2s(ax,ay),a=Math.min(1,b.t*6,(b.dur-b.t)*4);
    drawBubble(s.x,s.y,b.text,a,b.who==='me');
  }
  // ステージ名
  if(G.scene==='play'&&G.introT<2.2){
    const a=Math.min(1,G.introT*4,(2.2-G.introT)*2.5),fs=clamp(Math.min(W,H)*.075,22,52);
    g.globalAlpha=a;g.textAlign='center';g.lineJoin='round';
    g.font='800 '+fs*.45+'px '+FONT;g.lineWidth=fs*.12;g.strokeStyle='#fff';
    g.strokeText('STAGE '+(G.idx+1)+'　'+STAGES[G.idx].place,W/2,H*.3-fs*.75);g.fillStyle='#2b3440';g.fillText('STAGE '+(G.idx+1)+'　'+STAGES[G.idx].place,W/2,H*.3-fs*.75);
    g.font='800 '+fs+'px '+FONT;g.lineWidth=fs*.2;g.strokeText('「'+STAGES[G.idx].name+'」',W/2,H*.3+fs*.3);g.fillText('「'+STAGES[G.idx].name+'」',W/2,H*.3+fs*.3);
    g.globalAlpha=1;
  }
}

/* =========================================================
   ループ
   ========================================================= */
let last=performance.now();
function frame(now){
  let dt=(now-last)/1000;last=now;if(dt>.05)dt=.05;if(dt<0)dt=0;
  try{update(dt);render();}catch(e){console.error(e);}
  requestAnimationFrame(frame);
}
document.addEventListener('visibilitychange',()=>{if(!AU.ctx)return;if(document.hidden)AU.ctx.suspend();else AU.ctx.resume();last=performance.now();});
loadLevel(0); G.scene='title'; buildSelect();
requestAnimationFrame(frame);
})();
</script>
